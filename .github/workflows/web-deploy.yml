name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type check (web)
        run: pnpm --filter @td/web exec tsc --noEmit
      - name: Type check (crawler)
        run: pnpm --filter @td/crawler exec tsc --noEmit
      - name: Lint (web)
        run: pnpm --filter @td/web lint
        continue-on-error: true
